name: CI

# 在 main 分支的 push 与 pull request 上运行；每次提交都要过语法检查、测试和打包检查。
# Runs on pushes and pull requests targeting main: syntax check, tests, and a package dry run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run
